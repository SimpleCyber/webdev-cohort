<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JWT TOKEN TRY</title>
  </head>
  <body>
    <!-- Siugn up -->
    <div id="signup">
      Signup
      <input type="text" name="username" placeholder="Username" id="signup-username" />
      <input type="password" name="password" placeholder="Password" id="signup-password"/>
      <button onclick="signup()">Submit</button>
    </div>

    <!-- Sign in -->

    <div id="signin">
      Signin
      <input type="text" name="username" placeholder="Username" id="signin-username" />
      <input type="password" name="password" placeholder="Password" id="signin-password" />
      <button onclick="signin()">Submit</button>
    </div>

    <!-- user information -->
    <div id="user-info">
      User information:
      <div id="information"></div>
    </div>


    <!-- todo list -->

    <div id="todo">
      <h3>Todo list</h3>

      <div id="list-todo" style="display: flex;">
        <input type="checkbox" id="check-todo" />
        <h6>Todo</h6>
      </div>


      <div id="add">
        <input type="text" id="add-todo" placeholder="Enter the todo" /> 
        <button id="new-todo" onclick="addTodo()">Add todo to List</button>
      </div>


    </div>
    
    <br>

    <!-- logout -->
    <div id="logout">
      <button onclick="logout()">Logout</button>
    </div>
  </body>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>


  <script>
    updateUI();
    async function signup(){
        const username = document.getElementById("signup-username").value;
        const password = document.getElementById("signup-password").value;



        const response =  await axios.post("http://localhost:3000/signup", {
            username : username,
            password : password
        })

        alert(response.data.message)

    }

    async function signin(){
      const username = document.getElementById("signin-username").value;
      const password = document.getElementById("signin-password").value;



        const response =  await axios.post("http://localhost:3000/signin", {
            username : username,
            password : password
        });

        localStorage.setItem("token", response.data.token);
        
        alert(response.data);

        document.getElementById("signin").style.visibility ='hidden';
        document.getElementById("signup").style.visibility ='hidden';

    }

    async function getUserInfo(){
      const response = await axios.get("http://localhost:3000/get-password",{
        headers : {
          token : localStorage.getItem("token")
        }
      })

      document.getElementById("information").innerHTML = "Username :" + response.data.username +"<br>" + "Password :" + response.data.password ;

    }

    function logout(){
      localStorage.removeItem("token")
      alert("logout sucessfull");


        document.getElementById("logout").style.visibility ='hidden';
        document.getElementById("user-info").style.visibility ='hidden';
    }

    function updateUI(){
      const token = localStorage.getItem("token");

      if(token){
        document.getElementById("signin").style.visibility ='hidden';
        document.getElementById("signup").style.visibility ='hidden';
        document.getElementById("logout").style.display ='block';
        document.getElementById("user-info").style.display ='block';
        document.getElementById("todo").style.display ='block';
        getUserInfo();
      }
      else{
        document.getElementById("signin").style.display ='block';
        document.getElementById("signup").style.display ='block';
        document.getElementById("logout").style.visibility ='hidden';
        document.getElementById("todo").style.visibility ='hidden';
        document.getElementById("user-info").style.visibility ='hidden';
      }

    }

    // capture the todo on click add todo button and update the backend and again call the display url

    function addTodo(){
      const todo = document.getElementById("add-todo").value;

      

    }
  </script>
</html>
